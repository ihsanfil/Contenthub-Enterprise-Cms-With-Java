server:
  port: 8080
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/contenthub}
    username: ${SPRING_DATASOURCE_USERNAME:contenthub}
    password: ${SPRING_DATASOURCE_PASSWORD:contenthub}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-to-a-secure-32-byte-minimum-value}
    expiration-ms: 86400000
management:
  endpoints:
    web:
      exposure:
        include: health,info
