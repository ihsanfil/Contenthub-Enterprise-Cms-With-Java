services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: contenthub, POSTGRES_USER: contenthub, POSTGRES_PASSWORD: contenthub}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U contenthub -d contenthub"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/contenthub
      SPRING_DATASOURCE_USERNAME: contenthub
      SPRING_DATASOURCE_PASSWORD: contenthub
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: replace-this-with-a-secure-secret-of-at-least-32-bytes
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
  admin:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api]
volumes:
  postgres_data:
